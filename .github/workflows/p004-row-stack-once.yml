name: P0-04 one-shot LCD row stack AB review
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: p004-lcd-row-stack-once
  cancel-in-progress: false
jobs:
  memory-ab:
    if: ${{ github.event.issue.user.login == 'uysalayhan23' && github.event.issue.title == 'P004-LCD-ROW-STACK-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Official Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install official AVR tools and limited emulator
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          if ! arduino-cli lib install hd44780 TimerOne; then
            sleep 5
            arduino-cli lib install hd44780 TimerOne
          fi
          mkdir -p "$HOME/Arduino/libraries"
          git clone --quiet --depth 1 --branch arduino https://github.com/0xPIT/encoder.git "$HOME/Arduino/libraries/ClickEncoder"
          sudo apt-get update -qq
          sudo apt-get install -y -qq simavr libsimavr-dev libelf-dev
          mkdir -p "$RUNNER_TEMP/p004-row"
          gcc -std=c11 -O2 -Wall -Wextra -I/usr/include/simavr qa/p004/stack_probe.c -o "$RUNNER_TEMP/p004-row/stack_probe" -lsimavr -lelf
          bin=$(find "$HOME/.arduino15/packages/arduino/tools" -type f -name avr-size -print -quit)
          test -x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Same-source 8 MHz and 16 MHz stack and LCD comparison
        shell: bash
        run: bash qa/p004/run_row_avr_ab.sh
      - name: Capture compiler and simulator artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p004-row-stack-ab-${{ github.run_id }}
          path: ${{ runner.temp }}/p004-row/report/
          if-no-files-found: warn
          retention-days: 3
