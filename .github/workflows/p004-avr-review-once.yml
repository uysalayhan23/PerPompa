name: P0-04 read-only AVR review
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: p004-review-avr
  cancel-in-progress: false
jobs:
  avr-review:
    if: ${{ github.event.issue.user.login == 'uysalayhan23' && github.event.issue.title == 'P004-AVR-REVIEW-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and unpack QA-only candidate
        shell: bash
        run: |
          set -euo pipefail
          echo 'b9d04926776ce3703043c507fa804c6cc6ff6ca494f84df6b6926b37ff3d38f2  qa/p004/read_only_candidate.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/p004"
          tar -xzf qa/p004/read_only_candidate.tar.gz -C "$RUNNER_TEMP/p004"
          echo 'e0d852757f74fedc4c00dd9da05b9cf02bf660c72bf7dcaa4afc52c8a7710e21  '"$RUNNER_TEMP"'/p004/Peristaltic_Pump_Software_v1.06/Peristaltic_Pump_Software_v1.06.ino' | sha256sum -c -
      - name: Install official Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino AVR toolchain and libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install hd44780 TimerOne
          mkdir -p "$HOME/Arduino/libraries"
          git clone --quiet --depth 1 --branch arduino https://github.com/0xPIT/encoder.git "$HOME/Arduino/libraries/ClickEncoder"
          arduino-cli core list
          arduino-cli lib list
      - name: Compile 16 MHz and 8 MHz only — never upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p004-report"
          sketch="$RUNNER_TEMP/p004/Peristaltic_Pump_Software_v1.06"
          echo 'SOURCE_SHA256=e0d852757f74fedc4c00dd9da05b9cf02bf660c72bf7dcaa4afc52c8a7710e21' > "$RUNNER_TEMP/p004-report/RESULT.txt"
          for entry in '16MHz arduino:avr:pro:cpu=16MHzatmega328' '8MHz arduino:avr:pro:cpu=8MHzatmega328'; do
            name="${entry%% *}"
            fqbn="${entry#* }"
            mkdir -p "$RUNNER_TEMP/p004-build/$name"
            if arduino-cli compile --fqbn "$fqbn" --output-dir "$RUNNER_TEMP/p004-build/$name" "$sketch" > "$RUNNER_TEMP/p004-report/$name.log" 2>&1; then
              if ! grep -q 'Sketch uses' "$RUNNER_TEMP/p004-report/$name.log" || ! grep -q 'Global variables use' "$RUNNER_TEMP/p004-report/$name.log"; then
                echo "AVR_$name=FAIL_MEMORY_REPORT_MISSING" >> "$RUNNER_TEMP/p004-report/RESULT.txt"
                cat "$RUNNER_TEMP/p004-report/$name.log"
                exit 1
              fi
              echo "AVR_$name=PASS" >> "$RUNNER_TEMP/p004-report/RESULT.txt"
              grep -E 'Sketch uses|Global variables use' "$RUNNER_TEMP/p004-report/$name.log" | tee -a "$RUNNER_TEMP/p004-report/RESULT.txt"
            else
              echo "AVR_$name=FAIL" >> "$RUNNER_TEMP/p004-report/RESULT.txt"
              cat "$RUNNER_TEMP/p004-report/$name.log"
              exit 1
            fi
          done
          echo 'STACK_PEAK=NOT_RUN;PHYSICAL=NOT_RUN;RELEASE=BLOCKED;NO_FIRMWARE_UPLOAD' >> "$RUNNER_TEMP/p004-report/RESULT.txt"
          cat "$RUNNER_TEMP/p004-report/RESULT.txt"
      - name: Save compiler evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p004-avr-review-${{ github.run_id }}
          path: ${{ runner.temp }}/p004-report/
          if-no-files-found: warn
          retention-days: 3
