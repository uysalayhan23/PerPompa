name: P0-04 one-shot LCD flash SRAM A/B acceptance
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: p004-sram-flash-lcd-once
  cancel-in-progress: false
jobs:
  safe-sram-ab:
    if: ${{ github.event.issue.user.login == 'uysalayhan23' && github.event.issue.title == 'P004-SRAM-FLASH-AB-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup official Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install official AVR tools, Arduino libraries and simavr
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          if ! arduino-cli lib install hd44780 TimerOne; then
            sleep 5
            arduino-cli lib install hd44780 TimerOne
          fi
          mkdir -p "$HOME/Arduino/libraries"
          git clone --quiet --depth 1 --branch arduino https://github.com/0xPIT/encoder.git "$HOME/Arduino/libraries/ClickEncoder"
          sudo apt-get update -qq
          sudo apt-get install -y -qq simavr libsimavr-dev libelf-dev
          mkdir -p "$RUNNER_TEMP/p004"
          gcc -std=c11 -O2 -Wall -Wextra -I/usr/include/simavr qa/p004/stack_probe.c -o "$RUNNER_TEMP/p004/stack_probe" -lsimavr -lelf
          avrb=$(find "$HOME/.arduino15/packages/arduino/tools" -type f -name avr-size -print -quit)
          test -x "$avrb"
          echo "$(dirname "$avrb")" >> "$GITHUB_PATH"
      - name: Source SHA, positive-negative AVR 16-8 MHz and simAVR A/B test
        shell: bash
        run: bash qa/p004/run_flash_sram_ab.sh
      - name: Preserve ephemeral QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p004-flash-sram-ab-${{ github.run_id }}
          path: ${{ runner.temp }}/p004/report/
          if-no-files-found: warn
          retention-days: 3
