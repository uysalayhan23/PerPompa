name: P004 one-shot nominal EEPROM driver AVR ISR QA
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: p004-nominal-eepe-v106-once
  cancel-in-progress: false
jobs:
  qa-only:
    if: ${{ github.event.issue.user.login == 'uysalayhan23' && github.event.issue.title == 'P004-NOMINAL-EEPE-LIB-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Official Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make git libelf-dev
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install hd44780 TimerOne
          mkdir -p "$HOME/Arduino/libraries"
          git clone --quiet --depth 1 --branch arduino https://github.com/0xPIT/encoder.git "$HOME/Arduino/libraries/ClickEncoder"
          bin=$(find "$HOME/.arduino15/packages/arduino/tools" -type f -name avr-size -print -quit)
          test -x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Test-first patch and compile pinned simulator and original AVR
        shell: bash
        run: bash qa/p004/run_nominal_eepe_avr_qa.sh
      - name: Preserve read-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p004-nominal-eepe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p004-nominal-eepe/report/
            ${{ runner.temp }}/p004-marker-irq/report/
          if-no-files-found: warn
          retention-days: 3
