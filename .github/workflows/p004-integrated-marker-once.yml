name: P0-04 one-shot dense-marker EEPROM UART Timer ISR QA
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: p004-early-marker-isr-eeprom-qa
  cancel-in-progress: false
jobs:
  combined-coverage:
    if: ${{ github.event.issue.user.login == 'uysalayhan23' && github.event.issue.title == 'P004-INTEGRATED-DENSE-MARKER-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout SHA-locked read-only QA sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up official Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install AVR and emulated peripherals without physical upload
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          if ! arduino-cli lib install hd44780 TimerOne;then
            sleep 5
            arduino-cli lib install hd44780 TimerOne
          fi
          mkdir -p "$HOME/Arduino/libraries"
          git clone --quiet --depth 1 --branch arduino https://github.com/0xPIT/encoder.git "$HOME/Arduino/libraries/ClickEncoder"
          sudo apt-get update -qq
          sudo apt-get install -y -qq simavr libsimavr-dev libelf-dev
          mkdir -p "$RUNNER_TEMP/p004-marker-irq"
          gcc -std=c11 -O2 -Wall -Wextra -I/usr/include/simavr qa/p004/stack_integrated_marker_probe.c -o "$RUNNER_TEMP/p004-marker-irq/stack_marker_irq_probe" -lsimavr -lelf
          bin=$(find "$HOME/.arduino15/packages/arduino/tools" -type f -name avr-size -print -quit)
          test -x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Build real 8/16 MHz and verify actual EEPROM/UART/Timer ISR overlap
        shell: bash
        run: bash qa/p004/run_integrated_marker_avr.sh
      - name: Retain bounded positive-negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p004-early-marker-eeprom-uart-timer-${{ github.run_id }}
          path: ${{ runner.temp }}/p004-marker-irq/report/
          if-no-files-found: warn
          retention-days: 3
