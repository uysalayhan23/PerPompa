name: P0-04 one-shot AVR stack and heap evidence
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: p004-stack-heap-once
  cancel-in-progress: false
jobs:
  stack-heap-review:
    if: ${{ github.event.issue.user.login == 'uysalayhan23' && github.event.issue.title == 'P004-STACK-HEAP-REVIEW-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout read-only QA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          echo 'b9d04926776ce3703043c507fa804c6cc6ff6ca494f84df6b6926b37ff3d38f2  qa/p004/read_only_candidate.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/p004/sketch"
          tar -xzf qa/p004/read_only_candidate.tar.gz -C "$RUNNER_TEMP/p004/sketch"
          echo 'e0d852757f74fedc4c00dd9da05b9cf02bf660c72bf7dcaa4afc52c8a7710e21  '"$RUNNER_TEMP"'/p004/sketch/Peristaltic_Pump_Software_v1.06/Peristaltic_Pump_Software_v1.06.ino' | sha256sum -c -
      - name: Setup official Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install AVR compiler and bounded emulator
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install hd44780 TimerOne
          mkdir -p "$HOME/Arduino/libraries"
          git clone --quiet --depth 1 --branch arduino https://github.com/0xPIT/encoder.git "$HOME/Arduino/libraries/ClickEncoder"
          sudo apt-get update -qq
          sudo apt-get install -y -qq simavr libsimavr-dev libelf-dev
          mkdir -p "$RUNNER_TEMP/p004"
          gcc -std=c11 -O2 -Wall -Wextra -I/usr/include/simavr qa/p004/stack_probe.c -o "$RUNNER_TEMP/p004/stack_probe" -lsimavr -lelf
      - name: Capture AVR stack frames and simulated SP heap watermark
        shell: bash
        run: |
          set -euo pipefail
          sketch="$RUNNER_TEMP/p004/sketch/Peristaltic_Pump_Software_v1.06"
          report="$RUNNER_TEMP/p004/report"
          mkdir -p "$report"
          echo 'SOURCE_SHA256=e0d852757f74fedc4c00dd9da05b9cf02bf660c72bf7dcaa4afc52c8a7710e21' > "$report/RESULT.txt"
          for entry in '16MHz arduino:avr:pro:cpu=16MHzatmega328 16000000' '8MHz arduino:avr:pro:cpu=8MHzatmega328 8000000'; do
            read -r name fqbn hz <<< "$entry"
            build="$RUNNER_TEMP/p004/build-$name"
            arduino-cli compile --fqbn "$fqbn" --build-path "$build" \
              --build-property compiler.cpp.extra_flags=-fstack-usage \
              --build-property compiler.c.extra_flags=-fstack-usage \
              "$sketch" > "$report/compile-$name.log" 2>&1
            grep -E 'Sketch uses|Global variables use' "$report/compile-$name.log" | tee -a "$report/RESULT.txt"
            elf=$(find "$build" -name '*.elf' -print -quit)
            test -f "$elf"
            avr-size -A "$elf" > "$report/sections-$name.txt"
            avr-nm -n -C "$elf" > "$report/symbols-$name.txt"
            find "$build" -type f -name '*.su' -exec cat {} + > "$report/stack-frames-$name.txt"
            lines=$(wc -l < "$report/stack-frames-$name.txt")
            echo "STACK_FRAMES_$name=$lines" | tee -a "$report/RESULT.txt"
            test "$lines" -gt 0
            getaddr() {
              awk -v wanted="$2" '$3==wanted { v=$1; sub(/^0080/, "", v); print v; exit }' "$1"
            }
            brk=$(getaddr "$report/symbols-$name.txt" '__brkval')
            bss=$(getaddr "$report/symbols-$name.txt" '__bss_end')
            lcd=$(getaddr "$report/symbols-$name.txt" 'lcd_init_ok')
            echo "SYMBOLS_$name brk=$brk bss=$bss lcd=$lcd" | tee -a "$report/RESULT.txt"
            if [[ -z "$brk" || -z "$bss" ]]; then
              echo "SIMAVR_$name=REVIEW_MISSING_SYMBOLS" | tee -a "$report/RESULT.txt"
              continue
            fi
            if [[ -z "$lcd" ]]; then lcd=0; fi
            if timeout 75s "$RUNNER_TEMP/p004/stack_probe" "$elf" "$hz" "$brk" "$bss" "$lcd" > "$report/simavr-$name.txt" 2>&1; then
              echo "SIMAVR_$name=BOUNDED_TRACE_PASS" | tee -a "$report/RESULT.txt"
            else
              echo "SIMAVR_$name=REVIEW" | tee -a "$report/RESULT.txt"
            fi
            tail -n 17 "$report/simavr-$name.txt" | tee -a "$report/RESULT.txt"
          done
          echo 'ALL_PHYSICAL_OPERATING_PATHS_PEAK=NOT_RUN;PHYSICAL=NOT_RUN;RELEASE=BLOCKED;NO_UPLOAD' | tee -a "$report/RESULT.txt"
      - name: Upload bounded QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p004-stack-heap-${{ github.run_id }}
          path: ${{ runner.temp }}/p004/report/
          retention-days: 3
          if-no-files-found: warn
